name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and assemble
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Test, lint and assemble
        run: >
          ./gradlew --no-daemon --continue --stacktrace
          :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug

      - name: Summarise test results
        if: always()
        shell: python
        run: |
          import glob, os
          import xml.etree.ElementTree as ET

          rows = ["| Module | Tests | Failed | Skipped |", "| --- | ---: | ---: | ---: |"]
          for module, pattern in [
              (":core", "core/build/test-results/test/*.xml"),
              (":app", "app/build/test-results/testDebugUnitTest/*.xml"),
          ]:
              suites = [ET.parse(path).getroot() for path in glob.glob(pattern)]
              tests = sum(int(s.get("tests", 0)) for s in suites)
              failed = sum(int(s.get("failures", 0)) + int(s.get("errors", 0)) for s in suites)
              skipped = sum(int(s.get("skipped", 0)) for s in suites)
              rows.append(f"| `{module}` | {tests} | {failed} | {skipped} |")
          summary = "\n".join(rows)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### Unit tests\n\n" + summary + "\n")

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
            app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
